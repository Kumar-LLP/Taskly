<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bgGrad)" filter="url(#dropShadow)" />

  <!-- Subtle glow inner border -->
  <rect x="36" y="36" width="440" height="440" rx="100" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.2" />

  <!-- Stopwatch / Focus dial outer ring -->
  <circle cx="256" cy="270" r="140" fill="none" stroke="#ffffff" stroke-width="18" stroke-opacity="0.25" stroke-dasharray="8 6" />

  <!-- Stopwatch top pusher -->
  <rect x="236" y="86" width="40" height="28" rx="8" fill="#ffffff" />
  <rect x="246" y="114" width="20" height="18" fill="#ffffff" />

  <!-- Active Focus progress arc (270 degrees) -->
  <path d="M 256 130 A 140 140 0 1 1 116 270" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round" />

  <!-- Center Celebratory Checkmark -->
  <path d="M 185 275 L 235 325 L 335 215" fill="none" stroke="url(#checkGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
</svg>
